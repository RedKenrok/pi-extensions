name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same ref makes the older run's result irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # Streaming and cancellation tests can hang rather than fail when they
    # regress; bound the job so a hang costs minutes, not the 6-hour default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26.x
          cache: npm
      # Pi comes from the lockfile's pinned devDependencies. Installing other
      # versions afterwards would prune the package-local shared links that
      # the root postinstall creates.
      - run: npm ci
      - run: npm run ci
